
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fce4ec;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #ad1457;
        }

        #task-input {
            width: 65%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        #add-task {
            padding: 10px 15px;
            background-color: #d81b60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #add-task:hover {
            background-color: #ad1457;
        }

        #task-list {
            padding-left: 20px;
        }

        #task-list li {
            margin-top: 12px;
            padding: 10px;
            background-color: #fce4ec;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #task-list span {
            flex: 1;
            overflow-wrap: anywhere;
        }

        #task-list button {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>To-Do List</h2>

        <p>Masukkan tugas yang ingin kamu kerjakan:</p>

        <div id="output5"></div>
    </div>

    <script src="latihan5.js"></script>

</body>
</html>
